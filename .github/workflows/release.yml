name: Publish the book provider

on:
  workflow_dispatch:
    inputs:
      tag:
        description: the nimling/samna-bookable-server release tag, v<version>
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    uses: nimling/nimbody/.github/workflows/terraform-provider.yml@main
    with:
      cli: book
      repository: nimling/samna-bookable-server
      tag: ${{ inputs.tag }}
    secrets:
      repo_token: ${{ secrets.DOCKER_PACKAGE_READ }}
